name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter APK (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release (Universal & Split ABI)
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTConnect-Release-APKs
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

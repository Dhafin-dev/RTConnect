name: Static checks and releases

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Flutter and backend static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile backend Python files
        run: python -m compileall -q backend

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

  build-web:
    name: Build Flutter Web release
    needs: checks
    if: ${{ vars.API_BASE_URL != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          RT_AREA: ${{ vars.RT_AREA || 'RT 032 / RW 08 Griya Taman Asri' }}
        run: flutter build web --release --dart-define="API_BASE_URL=$API_BASE_URL" --dart-define="RT_AREA=$RT_AREA"

      - name: Upload Web release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtconnect-web-release
          path: build/web/
          retention-days: 14

  build-android:
    name: Build Android release artifacts
    needs: checks
    if: ${{ vars.API_BASE_URL != '' && vars.ANDROID_RELEASE_ENABLED == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure Android upload signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "Missing ANDROID_STORE_PASSWORD secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storeFile=app/upload-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties

      - name: Build APK and Play Store bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          RT_AREA: ${{ vars.RT_AREA || 'RT 032 / RW 08 Griya Taman Asri' }}
        run: |
          flutter build apk --release --dart-define="API_BASE_URL=$API_BASE_URL" --dart-define="RT_AREA=$RT_AREA"
          flutter build appbundle --release --dart-define="API_BASE_URL=$API_BASE_URL" --dart-define="RT_AREA=$RT_AREA"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtconnect-android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 14

name: rtconnect
description: "RTConnect - Aplikasi Administrasi RT/RW Terintegrasi Generative AI dan NLP Chatbot"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^14.0.0

  # Networking & REST API
  dio: ^5.4.1

  # Local Storage & Encryption
  flutter_secure_storage: ^9.0.0

  # Document Preview & Signature
  syncfusion_flutter_pdfviewer: ^25.1.39
  file_picker: ^8.0.0

  # Utilities & Deep Linking
  intl: ^0.19.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/diagrams/
